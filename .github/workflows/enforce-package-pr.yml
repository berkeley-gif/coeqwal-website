name: Enforce package-PR rule

# Enforces a soft policy: shared package changes must be delivered to dev via a
# pull request, never via a direct push.
#
# Markdown-only edits (READMEs etc.) under any of the watched paths are
# excluded.
#
# A violation generates a failed workflow run on the Actions tab. Whoever
# pushed gets the standard GitHub "workflow failed" email.
#
# The check itself lives in .github/scripts/check-package-pr-provenance.mjs
# (covered by pnpm test:ci-scripts). It retries transient GitHub API failures
# and, when the API stays unavailable, fails with an explicit availability
# error instead of a policy-violation error, still exit 1 so enforcement
# never fails open. Re-run the workflow to clear an availability failure.

on:
  push:
    branches: [dev]
    paths:
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "package.json"
      - "!**/*.md"
      - "!**/*.mdx"

permissions:
  contents: read

jobs:
  enforce:
    name: Was this push delivered via a PR?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # We need the full push range to inspect each commit. github.event.before
          # is the previous head; github.sha is the new head.
          fetch-depth: 0

      - name: Inspect push commits for PR provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/check-package-pr-provenance.mjs
