name: Deploy to Amplify

# Fires in two ways:
#   1. Manual via workflow_dispatch -> deploys the chosen app(s) on the chosen branch.
#   2. Automatic on push to dev that touches an apps/<X>/** path -> deploys
#      only those X. Pushes that only touch packages/** or other paths are
#      ignored by this workflow. See notify-package-changes.yml for the
#      PR-time notification that handles shared-package changes.
#
# Markdown-only edits inside an app folder do NOT trigger an auto-deploy.
# Those are excluded via the dorny/paths-filter step below. The workflow-
# level `paths:` filter does the same exclusion at the trigger stage so the
# workflow is not even invoked for doc-only pushes.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Which app(s) to deploy"
        required: true
        type: choice
        default: main
        options:
          - main
          - storyline-flow
          - storyline-climate
          - all-three
      branch:
        # Only `dev` is offered today. Production branches will be added to
        # this list, the MAP block in the deploy job, and the README "Apps and
        # Amplify ids" table when the production Amplify apps are created
        # (see README "Production deploys" for the playbook).
        description: "Amplify branch to deploy"
        required: true
        type: choice
        default: dev
        options:
          - dev
  push:
    branches: [dev]
    paths:
      - "apps/main/**"
      - "apps/storyline-flow/**"
      - "apps/storyline-climate/**"
      - "!apps/main/**/*.md"
      - "!apps/storyline-flow/**/*.md"
      - "!apps/storyline-climate/**/*.md"

permissions:
  id-token: write
  contents: read

# Serialize per-branch so two pushes to dev (or a dispatch racing a push)
# queue instead of clobbering each other in Amplify (StartJob rejects when a
# job is already pending or running for a branch). cancel-in-progress: false
# keeps the queue intact rather than dropping queued work.
concurrency:
  group: deploy-amplify-${{ inputs.branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve apps and branch
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.compute.outputs.apps }}
      branch: ${{ steps.compute.outputs.branch }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      # dorny/paths-filter pattern semantics, per
      # https://github.com/dorny/paths-filter#usage:
      #
      #   - Each filter is a list of glob patterns (picomatch syntax).
      #   - A pattern starting with `!` is a negation: it matches files
      #     that do NOT match the rest of the pattern.
      #   - `predicate-quantifier` controls how multiple patterns combine
      #     for a single file:
      #       'some'  (default) - file matches the filter if it matches
      #                           ANY one pattern (positive OR negation).
      #                           This makes `'!**/*.md'` flip the filter
      #                           to true for nearly every non-md file,
      #                           which is almost never what you want.
      #       'every'           - file matches only if it matches ALL
      #                           patterns. This is the gitignore-like
      #                           "include this folder, then subtract md"
      #                           behavior we want here.
      #
      # So the rule below means, for the `main` filter:
      #   file matches `apps/main/**` AND file does NOT match
      #   `apps/main/**/*.md` -> filter is true.
      #
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'push'
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            main:
              - 'apps/main/**'
              - '!apps/main/**/*.md'
            storyline-flow:
              - 'apps/storyline-flow/**'
              - '!apps/storyline-flow/**/*.md'
            storyline-climate:
              - 'apps/storyline-climate/**'
              - '!apps/storyline-climate/**/*.md'

      - id: compute
        env:
          EVENT: ${{ github.event_name }}
          SELECTION: ${{ inputs.apps }}
          DISPATCH_BRANCH: ${{ inputs.branch }}
          PUSH_BRANCH: ${{ github.ref_name }}
          MAIN_CHANGED: ${{ steps.filter.outputs.main || 'false' }}
          FLOW_CHANGED: ${{ steps.filter.outputs.storyline-flow || 'false' }}
          CLIMATE_CHANGED: ${{ steps.filter.outputs.storyline-climate || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            BRANCH="$DISPATCH_BRANCH"
            case "$SELECTION" in
              main)               APPS='["main"]' ;;
              storyline-flow)     APPS='["storyline-flow"]' ;;
              storyline-climate)  APPS='["storyline-climate"]' ;;
              all-three)          APPS='["main","storyline-flow","storyline-climate"]' ;;
              *) echo "::error::Unknown selection $SELECTION"; exit 1 ;;
            esac
          else
            BRANCH="$PUSH_BRANCH"
            APPS='[]'
            [[ "$MAIN_CHANGED"    == "true" ]] && APPS=$(jq -c '. + ["main"]' <<<"$APPS")
            [[ "$FLOW_CHANGED"    == "true" ]] && APPS=$(jq -c '. + ["storyline-flow"]' <<<"$APPS")
            [[ "$CLIMATE_CHANGED" == "true" ]] && APPS=$(jq -c '. + ["storyline-climate"]' <<<"$APPS")
          fi
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Will deploy: $APPS on branch $BRANCH"

  deploy:
    name: ${{ matrix.app }} -> ${{ needs.resolve.outputs.branch }}
    needs: resolve
    # Defensive: skip if resolve produced an empty array. Shouldn't happen
    # given the workflow-level paths filter, but if a push slips through
    # (e.g., paths-filter sees no diff because of a force-push), this avoids
    # a runtime matrix error.
    if: needs.resolve.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.resolve.outputs.apps) }}
    steps:
      - name: Resolve Amplify app id
        id: lookup
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          # Static map of (branch, app) -> Amplify appId. When wiring a
          # production app, add its row here AND add `production-<name>` to
          # the `branch:` dropdown above. See README "Production deploys".
          declare -A MAP=(
            ["dev:main"]="d2yqk6im560ffz"
            ["dev:storyline-flow"]="d11fk80jyl948s"
            ["dev:storyline-climate"]="d1tv02ylgdru7l"
          )
          ID="${MAP[${BRANCH}:${APP}]:-}"
          if [[ -z "$ID" ]]; then
            echo "::error::No Amplify appId mapped for branch=$BRANCH app=$APP"
            exit 1
          fi
          echo "app_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Resolved $APP on $BRANCH -> $ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AMPLIFY_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Start Amplify job
        id: start
        env:
          APP_ID: ${{ steps.lookup.outputs.app_id }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          JOB_ID=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "Started Amplify job $JOB_ID for $APP_ID on $BRANCH"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "View: https://console.aws.amazon.com/amplify/home?region=us-west-2#/${APP_ID}/${BRANCH}/${JOB_ID}"

      - name: Wait for Amplify job to finish
        env:
          APP_ID: ${{ steps.lookup.outputs.app_id }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          # Poll every 15s for up to 30 minutes. A normal build is 3-8 min.
          for _ in $(seq 1 120); do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)
            echo "[$(date -u +%H:%M:%S)] status=$STATUS"
            case "$STATUS" in
              SUCCEED)           exit 0 ;;
              FAILED|CANCELLED)  echo "::error::Amplify job $JOB_ID ended $STATUS"; exit 1 ;;
              PENDING|PROVISIONING|RUNNING) sleep 15 ;;
              *) echo "::warning::Unexpected status '$STATUS'"; sleep 15 ;;
            esac
          done
          echo "::error::Timed out waiting for Amplify job $JOB_ID"
          exit 1
