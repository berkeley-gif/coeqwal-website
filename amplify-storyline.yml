version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm install -g pnpm@10.0.0
            - pnpm install
        build:
          commands:
            - pnpm rebuild
            - npx turbo run build --filter=storyline-flow
      artifacts:
        baseDirectory: apps/storyline-flow/out
        files:
          - "**/*"
      buildPath: /
    appRoot: apps/storyline-flow
    environment:
      variables:
        NODE_VERSION: 22
