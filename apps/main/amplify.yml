version: 1
applications:
  - appRoot: apps/main
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - corepack enable
            - corepack prepare pnpm@10.0.0 --activate
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm rebuild
            - npx turbo run build --filter=main
      artifacts:
        baseDirectory: apps/main/out
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ~/.cache/pnpm/**/*
      buildPath: /
    environment:
      variables:
        NODE_VERSION: "22"
