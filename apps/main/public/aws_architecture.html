<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COEQWAL AWS Architecture</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #f5f5f5;
        padding: 24px;
        overflow-x: auto;
      }

      .diagram {
        max-width: 100%;
      }

      .diagram object,
      .diagram img {
        display: block;
        width: 100%;
        height: auto;
        min-width: 1400px;
      }
    </style>
  </head>
  <body>
    <div class="diagram">
      <object
        type="image/svg+xml"
        data="/aws_architecture.svg"
        aria-label="COEQWAL AWS architecture diagram"
      >
        <img
          src="/aws_architecture.svg"
          alt="COEQWAL AWS architecture diagram"
        />
      </object>
    </div>
  </body>
</html>
