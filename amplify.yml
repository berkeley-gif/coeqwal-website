version: 2
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm install -g pnpm@10.0.0
            - pnpm -v
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm turbo run build --filter=main
      artifacts:
        baseDirectory: apps/main/out
        files:
          - "**/*"
      buildPath: /
    appRoot: apps/main
