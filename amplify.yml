version: 1
applications:
  - appRoot: apps/main
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm install -g pnpm@10.0.0
            - pnpm install
        build:
          commands:
            - pnpm rebuild
            - npx turbo run build --filter=main
      artifacts:
        baseDirectory: apps/main/out
        files:
          - "**/*"
      cache:
        # Cache the pnpm content-addressable store only. node_modules is
        # rebuilt fresh by pnpm install each run, which avoids hardlink
        # drift across cached builds.
        paths:
          - ~/.cache/pnpm/**/*
      buildPath: /
    environment:
      variables:
        NODE_VERSION: 22

